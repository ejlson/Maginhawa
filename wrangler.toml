# ═══════════ WHAT CLOUDFLARE PUBLISHES ═══════════════════════════════════════
# The first deploy failed with "Pages only supports files up to 25 MiB in size
# — assets/menu/cafe_mama/wall-panel-40-2017-Corona.pdf is 30.5 MiB". That PDF
# was never meant to be on the web. The real fault was two lines earlier in the
# same log:
#
#     No Wrangler configuration file found. Continuing.
#     No build command specified. Skipping build step.
#
# With no build and no asset directory, Cloudflare published the REPOSITORY
# ROOT — the source tree, the design files in assets/, everything — and hit the
# size ceiling on the way through. Even had the PDF been small enough, that
# deploy would have "succeeded" and served no website, because there is no
# index.html at the root of this repository.
#
# ⚠️ THIS IS A **WORKERS** PROJECT, NOT A PAGES PROJECT, AND THE TWO TAKE
# DIFFERENT KEYS. The dashboard's Build settings show `npx wrangler deploy` as
# the deploy command and `npx wrangler versions upload` as the version command,
# and the project has Bindings / Runtime / Trigger events tabs — all of which
# are Workers, not Pages. So the directory is declared as `[assets]` below.
# `pages_build_output_dir`, which an earlier pass here used, is a PAGES-ONLY
# key: `wrangler deploy` rejects a config carrying it. If this ever moves back
# to a real Pages project, that key returns and this block goes.
#
# `directory` points at `out/`, which is what `output: "export"` in
# next.config.mjs produces.
#
# `not_found_handling = "404-page"` serves out/404.html for an unknown path.
# Do NOT use "single-page-application" — that returns index.html with a 200 for
# every miss, which would hand crawlers the home page under every wrong URL and
# bury the real 404.
#
# ⚠️ THE BUILD COMMAND CANNOT LIVE HERE. Wrangler config has no key for it; it
# is a dashboard setting. Settings → Build → Build command: `npm run build`.
# (Already set correctly as of 2026-08-14.)
#
# ⚠️ AND NEITHER CAN THE CLOUDINARY VARIABLE. `NEXT_PUBLIC_*` is inlined by
# Next AT BUILD TIME, so it must be a **build** variable —
# Settings → Build → "Build variables and secrets" — NOT the runtime
# "Variables and secrets" section further up the same page. Cloudflare states
# plainly that runtime variables are not available during the build, so one set
# there is read by nothing and every photograph silently stays local.
#
#     NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME = mmia7qfr
#
# Per-file ceiling here is the same 25 MiB as Pages. The largest file in the
# build is now videos/bintang-hero.mp4 at 18.6MB — see CLOUDINARY.md.
name = "maginhawa"
compatibility_date = "2026-08-14"

[assets]
directory = "./out"
not_found_handling = "404-page"


# ═══════════ THERE IS NO REQUEST-TIME CODE HERE, AND THAT IS DELIBERATE ══════
#
# This config briefly carried `main = "./worker/index.ts"`, an `[assets]`
# `binding`, `run_worker_first = ["/api/*"]`, a `[[send_email]]` binding and
# a `[[ratelimits]]` block — all of it to serve ONE endpoint, POST
# /api/contact, which delivered the enquiry form. Every bit of it was removed
# on 2026-08-27 at the user's instruction, because the form now hands off to
# the reader's own mail client with a `mailto:` and asks nothing of the
# server. The site is a folder of static files again, start to finish.
#
# ⚠️ THE FILES ARE STILL IN THE REPOSITORY AND ARE NOW INERT.
# worker/index.ts, functions/api/contact.ts and scripts/probe-contact-fn.mjs
# are not referenced by anything and are not deployed — nothing loads a
# Worker without `main`. They are kept because the handler is complete and
# tested, and re-adding it is a config change rather than a rewrite.
#
# ── IF SERVER-SIDE DELIVERY IS EVER WANTED AGAIN, THIS IS THE WHOLE LIST ──
#   1. main = "./worker/index.ts"
#   2. binding = "ASSETS" under [assets]        — without it the Worker
#      cannot hand ordinary page requests back and every miss 500s
#   3. run_worker_first = ["/api/*"] under [assets]
#   4. [[send_email]] name = "EMAIL", destination_address = "info@mgnhw.com"
#   5. [vars] CONTACT_TO / CONTACT_FROM
#   6. [[ratelimits]] name = "CONTACT_RATELIMIT", namespace_id = "1001",
#      [ratelimits.simple] limit = 3, period = 60   (period takes 10 or 60,
#      nothing else) — and contact.ts's WINDOW_SECONDS must match it
#   7. onboard a SENDING domain in the dashboard (Compute → Email Service →
#      Email Sending). Use a subdomain such as send.maginhawagroup.co.uk:
#      onboarding writes `_dmarc.<domain>` at the ROOT, and this zone already
#      has one — `v=DMARC1; p=reject; adkim=r; aspf=r; rua=…` — governing the
#      group's real Microsoft 365 mail. Apex onboarding overwrites it. The
#      apex SPF and apex MX are NOT touched either way.
#   8. point Contact.tsx's handleSubmit back at fetch("/api/contact")
#
# ⚠️ AND DO NOT REACH FOR EMAIL ROUTING TO DO IT. That is the INBOUND feature
# and cannot send; enabling it takes over the ROOT domain's MX records, which
# on both maginhawagroup.co.uk and mgnhw.com currently point at Microsoft 365
# — it would redirect the group's real incoming mail.
